name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.platform }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            bundles: deb,appimage
            extensions: deb,AppImage
          - os: windows-2022
            platform: windows
            bundles: nsis
            extensions: exe
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          assert.match(tag, /^v\d+\.\d+\.\d+$/, 'Use a stable vMAJOR.MINOR.PATCH tag');
          const version = tag.slice(1);
          for (const path of ['package.json', 'src-tauri/tauri.conf.json']) {
            assert.equal(JSON.parse(readFileSync(path, 'utf8')).version, version, `${path} version must match ${tag}`);
          }
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const packageSection = cargo.split('[package]')[1]?.split(/\n\[/)[0];
          assert.equal(packageSection?.match(/^version\s*=\s*"([^"]+)"/m)?.[1], version, `Cargo package version must match ${tag}`);
          NODE

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xdg-utils

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup override set stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.platform }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      # The Rust scaffold test verifies the configured frontendDist exists.
      - name: Build frontend for Rust tests
        run: npm run build

      - name: Check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check TypeScript and ESLint
        run: npm run typecheck && npm run lint

      - name: Test frontend
        run: npx vitest run

      - name: Build production installers
        env:
          BUNDLES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri build -- --ci --bundles "$BUNDLES" -- --locked

      - name: Collect and verify installers
        env:
          EXPECTED_EXTENSIONS: ${{ matrix.extensions }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { copyFileSync, mkdirSync, readdirSync, statSync } from 'node:fs';
          import { basename, join } from 'node:path';
          const root = 'src-tauri/target/release/bundle';
          const files = readdirSync(root, { recursive: true }).map(path => join(root, path));
          mkdirSync('build/packages', { recursive: true });
          for (const extension of process.env.EXPECTED_EXTENSIONS.split(',')) {
            const matches = files.filter(path => path.endsWith(`.${extension}`) && statSync(path).isFile());
            assert.equal(matches.length, 1, `Expected exactly one .${extension} installer`);
            assert.ok(statSync(matches[0]).size > 0, `Empty installer: ${matches[0]}`);
            copyFileSync(matches[0], join('build/packages', basename(matches[0])));
          }
          NODE

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meowndesk-${{ matrix.platform }}-x64-${{ github.sha }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish versioned release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: meowndesk-*-x64-${{ github.sha }}
          path: packages
          merge-multiple: true

      - name: Publish all installers together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          deb=(packages/*.deb)
          appimage=(packages/*.AppImage)
          nsis=(packages/*.exe)
          [[ ${#deb[@]} -eq 1 && ${#appimage[@]} -eq 1 && ${#nsis[@]} -eq 1 ]]
          files=("${deb[@]}" "${appimage[@]}" "${nsis[@]}")
          for file in "${files[@]}"; do test -s "$file"; done

          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt; then
            grep -qx true release-state.txt || { echo 'Release is already published'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Meowndesk $RELEASE_TAG" \
              --notes 'Unsigned x64 installers: Linux Debian package and AppImage, and Windows NSIS installer. Native hardware acceptance remains pending.'
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
